<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel — MVP Internship</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090c10;--surface:#10151f;--card:#141a27;--border:#1c2538;
  --accent:#f5a623;--a2:#4fc3f7;--a3:#81c784;--red:#ff6b6b;
  --text:#dce6f5;--muted:#5c6f8a;
  --p1:#9c6cf7;--p2:#29b6f6;--p3:#4caf50;--pa:#ff9800;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh}

/* TOP BAR */
header{display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100}
.hd-title{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--accent)}
.hd-links{display:flex;gap:1rem}
.hd-links a{font-size:.8rem;color:var(--muted);transition:color .2s}
.hd-links a:hover{color:var(--text)}
.btn-new{background:var(--accent);color:#000;border:none;
  padding:.4rem 1.1rem;border-radius:7px;font-size:.8rem;
  font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:opacity .2s}
.btn-new:hover{opacity:.85}

/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}

/* STATS BAR */
.stats-bar{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.sbar{background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:.85rem 1.25rem;flex:1;min-width:120px}
.sbar-n{font-family:'JetBrains Mono',monospace;font-size:1.6rem;color:var(--accent);display:block}
.sbar-l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* FILTERS / SEARCH */
.controls{display:flex;gap:.75rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.search{background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:.5rem 1rem;border-radius:8px;
  font-size:.85rem;font-family:'Outfit',sans-serif;outline:none;
  flex:1;min-width:200px;transition:border-color .2s}
.search:focus{border-color:rgba(245,166,35,.4)}
.search::placeholder{color:var(--muted)}
select.fsel{background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:.5rem .85rem;border-radius:8px;
  font-size:.82rem;font-family:'Outfit',sans-serif;outline:none;cursor:pointer}

/* TABLE */
.table-wrap{background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead tr{background:rgba(255,255,255,.03)}
th{padding:.85rem 1rem;text-align:left;font-size:.7rem;
  font-family:'JetBrains Mono',monospace;color:var(--muted);
  letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid rgba(28,37,56,.6);transition:background .15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.02)}
td{padding:.85rem 1rem;font-size:.83rem;vertical-align:top}
.td-date{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--accent);white-space:nowrap}
.td-hrs{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted)}
.td-phase{font-size:.68rem;font-family:'JetBrains Mono',monospace;
  padding:.15rem .5rem;border-radius:4px;white-space:nowrap}
.p1{background:rgba(156,108,247,.1);color:var(--p1)}
.p2{background:rgba(41,182,246,.1);color:var(--p2)}
.p3{background:rgba(76,175,80,.1);color:var(--p3)}
.pa{background:rgba(255,152,0,.1);color:var(--pa)}
.td-sum{color:var(--muted);line-height:1.55;max-width:320px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.td-skills{display:flex;flex-wrap:wrap;gap:.25rem;max-width:180px}
.sk{font-family:'JetBrains Mono',monospace;font-size:.6rem;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  color:var(--muted);padding:.1rem .4rem;border-radius:3px}
.td-actions{display:flex;gap:.5rem;white-space:nowrap}
.btn-edit,.btn-del{border:none;padding:.3rem .7rem;border-radius:6px;
  font-size:.72rem;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif}
.btn-edit{background:rgba(79,195,247,.12);color:var(--a2)}
.btn-edit:hover{background:rgba(79,195,247,.22)}
.btn-del{background:rgba(255,107,107,.1);color:var(--red)}
.btn-del:hover{background:rgba(255,107,107,.22)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:300;display:none;align-items:center;justify-content:center;padding:1rem}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);
  border-radius:16px;width:100%;max-width:680px;max-height:90vh;
  overflow-y:auto;padding:2rem}
.modal-title{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--accent);
  margin-bottom:1.75rem;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.2rem;
  cursor:pointer;line-height:1;transition:color .2s}
.modal-close:hover{color:var(--text)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:.4rem}
label{font-size:.75rem;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:.6rem .85rem;border-radius:8px;
  font-size:.875rem;font-family:'Outfit',sans-serif;outline:none;
  transition:border-color .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:rgba(245,166,35,.45)}
textarea{resize:vertical;min-height:90px;line-height:1.65}
.modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.5rem}
.btn-cancel{background:var(--card);border:1px solid var(--border);
  color:var(--muted);padding:.5rem 1.1rem;border-radius:8px;
  font-size:.82rem;cursor:pointer;font-family:'Outfit',sans-serif}
.btn-save{background:var(--accent);color:#000;border:none;
  padding:.5rem 1.3rem;border-radius:8px;font-size:.82rem;
  font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif}
.btn-save:hover{opacity:.85}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;z-index:500;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:.7rem 1.25rem;border-radius:10px;
  font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{border-color:var(--a3);color:var(--a3)}
.toast.error{border-color:var(--red);color:var(--red)}

/* VIEW MODAL */
.view-section{margin-bottom:1.25rem}
.view-label{font-family:'JetBrains Mono',monospace;font-size:.65rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.view-text{font-size:.875rem;line-height:1.75;color:rgba(220,230,245,.85)}
.view-outcome{background:rgba(129,199,132,.05);border:1px solid rgba(129,199,132,.15);
  border-radius:8px;padding:.85rem 1rem}
.view-outcome .view-text{color:rgba(129,199,132,.9)}
.view-blocker{background:rgba(255,107,107,.05);border:1px solid rgba(255,107,107,.15);
  border-radius:8px;padding:.85rem 1rem}
.view-blocker .view-text{color:rgba(255,150,150,.9)}

.empty{text-align:center;padding:3.5rem;color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:.8rem}
</style>
</head>
<body>

<header>
  <div class="hd-title">// Admin Panel — VTU Internship 2026</div>
  <div class="hd-links">
    <a href="/">← Public View</a>
    <button class="btn-new" onclick="openAdd()">+ New Entry</button>
  </div>
</header>

<div class="wrap">
  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="sbar"><span class="sbar-n" id="st-total">—</span><span class="sbar-l">Total Entries</span></div>
    <div class="sbar"><span class="sbar-n" id="st-hrs">—</span><span class="sbar-l">Total Hours</span></div>
    <div class="sbar"><span class="sbar-n" id="st-p1">—</span><span class="sbar-l">Phase 1 Entries</span></div>
    <div class="sbar"><span class="sbar-n" id="st-p2">—</span><span class="sbar-l">Phase 2 Entries</span></div>
    <div class="sbar"><span class="sbar-n" id="st-p3">—</span><span class="sbar-l">Phase 3 Entries</span></div>
    <div class="sbar"><span class="sbar-n" id="st-pa">—</span><span class="sbar-l">April Entries</span></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <input class="search" type="text" placeholder="Search entries by date, summary, skills..." oninput="search(this.value)">
    <select class="fsel" onchange="filterPhase(this.value)">
      <option value="all">All Phases</option>
      <option value="Phase 1">Phase 1</option>
      <option value="Phase 2">Phase 2</option>
      <option value="Phase 3">Phase 3</option>
      <option value="April">April</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Hrs</th><th>Phase</th><th>Work Summary</th>
          <th>Skills</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbl"></tbody>
    </table>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="form-overlay">
  <div class="modal">
    <div class="modal-title">
      <span id="modal-title-text">New Entry</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group">
        <label>Hours</label>
        <input type="number" id="f-hours" min="1" max="16" step="0.5" placeholder="e.g. 6">
      </div>
      <div class="form-group">
        <label>Phase</label>
        <select id="f-phase">
          <option value="Phase 1">Phase 1</option>
          <option value="Phase 2">Phase 2</option>
          <option value="Phase 3">Phase 3</option>
          <option value="April">April</option>
        </select>
      </div>
      <div class="form-group">
        <label>Skills (comma separated)</label>
        <input type="text" id="f-skills" placeholder="Flutter, Firebase, Git">
      </div>
      <div class="form-group form-full">
        <label>Work Summary</label>
        <textarea id="f-work" rows="5" placeholder="Describe today's work session..."></textarea>
      </div>
      <div class="form-group form-full">
        <label>Learning Outcome</label>
        <textarea id="f-outcome" rows="5" placeholder="What did you learn today?"></textarea>
      </div>
      <div class="form-group form-full">
        <label>Blockers / Risks</label>
        <textarea id="f-blockers" rows="2" placeholder="No Blockers, or describe any issues faced..."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="overlay" id="view-overlay">
  <div class="modal">
    <div class="modal-title">
      <span id="view-title">Entry Detail</span>
      <button class="modal-close" onclick="closeView()">✕</button>
    </div>
    <div id="view-body"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeView()">Close</button>
      <button class="btn-edit" id="view-edit-btn">Edit</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
let allEntries = [];
let editId = null;
let filteredPhase = 'all';
let searchQ = '';

function phaseClass(p) {
  return {Phase1:'p1',Phase2:'p2',Phase3:'p3',April:'pa'}[p.replace(/\s+/,'')];
}

async function loadStats() {
  const r = await fetch('/api/stats');
  const s = await r.json();
  document.getElementById('st-total').textContent = s.total_entries;
  document.getElementById('st-hrs').textContent = s.total_hours;
  s.by_phase.forEach(bp => {
    const map = {'Phase 1':'p1','Phase 2':'p2','Phase 3':'p3','April':'pa'};
    const el = document.getElementById('st-' + map[bp.phase]);
    if (el) el.textContent = bp.c;
  });
}

async function loadEntries() {
  const r = await fetch('/api/entries');
  allEntries = await r.json();
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tbl');
  let data = allEntries;
  if (filteredPhase !== 'all') data = data.filter(e => e.phase === filteredPhase);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    data = data.filter(e =>
      e.date.includes(q) || e.work_summary.toLowerCase().includes(q) ||
      e.skills.toLowerCase().includes(q) || e.learning_outcome.toLowerCase().includes(q) ||
      e.phase.toLowerCase().includes(q)
    );
  }
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">No entries found.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(e => `
    <tr>
      <td class="td-date">${fmtDate(e.date)}</td>
      <td class="td-hrs">${e.hours}h</td>
      <td><span class="td-phase ${phaseClass(e.phase)}">${e.phase}</span></td>
      <td><div class="td-sum">${e.work_summary}</div></td>
      <td><div class="td-skills">${e.skills.split(',').map(s=>`<span class="sk">${s.trim()}</span>`).join('')}</div></td>
      <td>
        <div class="td-actions">
          <button class="btn-edit" onclick="viewEntry(${e.id})">View</button>
          <button class="btn-edit" onclick="openEdit(${e.id})">Edit</button>
          <button class="btn-del" onclick="deleteEntry(${e.id})">Del</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});
}

function search(v) { searchQ = v; renderTable(); }
function filterPhase(v) { filteredPhase = v; renderTable(); }

// ADD / EDIT
function openAdd() {
  editId = null;
  document.getElementById('modal-title-text').textContent = 'New Entry';
  document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('f-hours').value = '';
  document.getElementById('f-phase').value = 'Phase 1';
  document.getElementById('f-skills').value = 'Flutter';
  document.getElementById('f-work').value = '';
  document.getElementById('f-outcome').value = '';
  document.getElementById('f-blockers').value = 'No Blockers.';
  document.getElementById('form-overlay').classList.add('show');
}

function openEdit(id) {
  const e = allEntries.find(x => x.id === id);
  if (!e) return;
  editId = id;
  document.getElementById('modal-title-text').textContent = 'Edit Entry — ' + fmtDate(e.date);
  document.getElementById('f-date').value = e.date;
  document.getElementById('f-hours').value = e.hours;
  document.getElementById('f-phase').value = e.phase;
  document.getElementById('f-skills').value = e.skills;
  document.getElementById('f-work').value = e.work_summary;
  document.getElementById('f-outcome').value = e.learning_outcome;
  document.getElementById('f-blockers').value = e.blockers;
  document.getElementById('form-overlay').classList.add('show');
}

function closeModal() { document.getElementById('form-overlay').classList.remove('show'); }

async function saveEntry() {
  const body = {
    date: document.getElementById('f-date').value,
    hours: document.getElementById('f-hours').value,
    phase: document.getElementById('f-phase').value,
    skills: document.getElementById('f-skills').value,
    work_summary: document.getElementById('f-work').value,
    learning_outcome: document.getElementById('f-outcome').value,
    blockers: document.getElementById('f-blockers').value || 'No Blockers.'
  };
  if (!body.date || !body.hours || !body.work_summary || !body.learning_outcome) {
    toast('Please fill all required fields.', 'error'); return;
  }
  try {
    const method = editId ? 'PUT' : 'POST';
    const url = editId ? `/api/entries/${editId}` : '/api/entries';
    const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (!r.ok) throw new Error('Save failed');
    closeModal();
    await loadEntries();
    await loadStats();
    toast(editId ? 'Entry updated!' : 'Entry added!', 'success');
  } catch(e) { toast('Error saving entry.', 'error'); }
}

async function deleteEntry(id) {
  const e = allEntries.find(x => x.id === id);
  if (!confirm(`Delete entry for ${fmtDate(e.date)}?`)) return;
  try {
    await fetch(`/api/entries/${id}`, {method:'DELETE'});
    await loadEntries();
    await loadStats();
    toast('Entry deleted.', 'success');
  } catch(e) { toast('Error deleting entry.', 'error'); }
}

// VIEW
function viewEntry(id) {
  const e = allEntries.find(x => x.id === id);
  document.getElementById('view-title').textContent = fmtDate(e.date) + ' · ' + e.phase;
  const hasBlocker = e.blockers && !/^no\s*(blockers?|risks?)/i.test(e.blockers.trim());
  document.getElementById('view-body').innerHTML = `
    <div class="view-section">
      <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem">
        <span style="font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--accent)">${fmtDate(e.date)}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted)">${e.hours} hours</span>
        <span class="td-phase ${phaseClass(e.phase)}">${e.phase}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1rem">
        ${e.skills.split(',').map(s=>`<span class="sk">${s.trim()}</span>`).join('')}
      </div>
    </div>
    <div class="view-section">
      <div class="view-label">Work Summary</div>
      <p class="view-text">${e.work_summary}</p>
    </div>
    <div class="view-section">
      <div class="view-outcome">
        <div class="view-label">Learning Outcome</div>
        <p class="view-text">${e.learning_outcome}</p>
      </div>
    </div>
    ${hasBlocker ? `
    <div class="view-section">
      <div class="view-blocker">
        <div class="view-label">⚠ Blockers / Risks</div>
        <p class="view-text">${e.blockers}</p>
      </div>
    </div>` : ''}
  `;
  document.getElementById('view-edit-btn').onclick = () => { closeView(); openEdit(id); };
  document.getElementById('view-overlay').classList.add('show');
}

function closeView() { document.getElementById('view-overlay').classList.remove('show'); }

// CLOSE OVERLAY ON BG CLICK
document.getElementById('form-overlay').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });
document.getElementById('view-overlay').addEventListener('click', e => { if (e.target===e.currentTarget) closeView(); });

// TOAST
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// INIT
loadStats();
loadEntries();
</script>
</body>
</html>
